  <!-- Glassmorphic Bezier Control Nodes -->
  <circle cx="116" cy="326" r="34" fill="url(#glassSphere)" stroke="#E2E8F0" stroke-opacity="0.6" stroke-width="3"/>
  <circle cx="414" cy="196" r="36" fill="url(#glassSphere)" stroke="#E2E8F0" stroke-opacity="0.6" stroke-width="3"/>
