  <!-- Charcoal Squircle Tile -->
  <rect x="12" y="12" width="488" height="488" rx="112" fill="url(#bg)" stroke="#3F4147" stroke-width="6"/>

  <!-- Left Ribbon Inner Cyan Fold -->
