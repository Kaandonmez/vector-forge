  <!-- Left Ribbon Front Lime Fold -->
  <path d="M174 88 L104 134 C88 146 92 178 108 218 L178 368 C196 398 224 388 238 358 L266 286 L190 128 C182 104 178 88 174 88 Z" fill="url(#leftFront)"/>

  <!-- Right Ribbon Front Cyan-to-Violet Fold -->
